name: Build One-KVM Overlay Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: 克隆 One-KVM 源码
        run: git clone https://github.com/yuzl1/One-KVM.git --depth=1 /tmp/onekvm

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: 编译 One-KVM 前端
        run: cd /tmp/onekvm/web && npm install && npm run build

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: armv7-unknown-linux-gnueabihf }

      - uses: taiki-e/install-action@v2
        with: { tool: cross }

      - name: 交叉编译 One-KVM ARMv7
        run: |
          export CARGO_BUILD_RUSTFLAGS="-C lto=off -C codegen-units=4"
          cd /tmp/onekvm && ./build/build-images.sh armv7

      - name: 打包部署文件
        shell: bash
        run: |
          mkdir -p pkg/usr/bin pkg/usr/lib/one-kvm-libs pkg/etc/ssl/certs pkg/etc/init.d

          ONEKVM=/tmp/onekvm
          BIN=$ONEKVM/target/armv7-unknown-linux-gnueabihf/release/one-kvm
          cp $BIN pkg/usr/bin/
          cp sysdrv/tools/board/buildroot/overlay/etc/init.d/S85onekvm pkg/etc/init.d/

          # 提取 glibc 运行时库（板子是 uClibc）
          readelf -d $BIN | grep NEEDED | awk '{print $NF}' | tr -d '[]' > /tmp/needed.txt

          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          sudo rm -f /etc/apt/sources.list.d/ubuntu-*.list /etc/apt/sources.list.d/ports-*.list 2>/dev/null || true
          sudo dpkg --add-architecture armhf
          sudo tee /etc/apt/sources.list.d/armhf.list <<'END'
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          END
          sudo apt-get update -qq

          declare -A SO2PKG=(
            ["ld-linux-armhf.so.3"]="libc6:armhf"
            ["libc.so.6"]="libc6:armhf" ["libm.so.6"]="libc6:armhf"
            ["libpthread.so.0"]="libc6:armhf" ["libdl.so.2"]="libc6:armhf"
            ["librt.so.1"]="libc6:armhf" ["libgcc_s.so.1"]="libgcc-s1:armhf"
            ["libstdc++.so.6"]="libstdc++6:armhf" ["libdrm.so.2"]="libdrm2:armhf"
            ["libudev.so.1"]="libudev1:armhf" ["libasound.so.2"]="libasound2:armhf"
            ["libssl.so.3"]="libssl3:armhf" ["libcrypto.so.3"]="libssl3:armhf"
          )

          PKGS=""
          while read -r so; do
            pkg="${SO2PKG[$so]}"
            [ -n "$pkg" ] && PKGS="$PKGS $pkg" || echo "  ⚠ unmapped: $so"
          done < /tmp/needed.txt
          PKGS=$(echo $PKGS | tr ' ' '\n' | sort -u | tr '\n' ' ')

          sudo apt-get install -y -qq $PKGS ca-certificates
          sudo apt-get install -y -qq binutils-arm-linux-gnueabihf 2>/dev/null || true

          L=/lib/arm-linux-gnueabihf UL=/usr/lib/arm-linux-gnueabihf
          while read -r so; do
            [ -f "$L/$so" ] && cp "$L/$so" pkg/usr/lib/one-kvm-libs/ && continue
            [ -f "$UL/$so" ] && cp "$UL/$so" pkg/usr/lib/one-kvm-libs/ && continue
            echo "  ⚠ not found: $so"
          done < /tmp/needed.txt

          arm-linux-gnueabihf-strip pkg/usr/lib/one-kvm-libs/*.so* 2>/dev/null || true
          cp /etc/ssl/certs/ca-certificates.crt pkg/etc/ssl/certs/

          # 一键安装脚本
          cat > pkg/install.sh << 'SCRIPT'
          #!/bin/sh
          set -e
          echo "Installing One-KVM to rootfs..."
          cp -a usr/* /usr/
          cp -a etc/ssl/* /etc/ssl/ 2>/dev/null || true
          cp etc/init.d/S85onekvm /etc/init.d/
          chmod +x /usr/bin/one-kvm /etc/init.d/S85onekvm
          mkdir -p /var/lib/one-kvm
          echo "Done. Reboot to auto-start, or run: /etc/init.d/S85onekvm start"
          SCRIPT
          chmod +x pkg/install.sh

          echo "=== Package contents ==="
          find pkg -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: onekvm-rootfs-package
          path: pkg/
          retention-days: 90
