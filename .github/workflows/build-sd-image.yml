name: Build SD Card Image with One-KVM

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-onekvm:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: 克隆 One-KVM 源码
        run: git clone https://github.com/yuzl1/One-KVM.git --depth=1 /tmp/onekvm

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: 编译 One-KVM 前端
        run: cd /tmp/onekvm/web && npm install && npm run build

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: armv7-unknown-linux-gnueabihf }

      - uses: taiki-e/install-action@v2
        with: { tool: cross }

      - name: 交叉编译 One-KVM ARMv7
        run: |
          cd /tmp/onekvm
          export CARGO_BUILD_RUSTFLAGS="-C lto=off -C codegen-units=4"
          ./build/build-images.sh armv7

      - name: 打包 One-KVM + 运行时库
        shell: bash
        run: |
          ONEKVM=/tmp/onekvm
          mkdir -p pkg/usr/bin pkg/usr/lib/one-kvm-libs pkg/etc/ssl/certs

          BIN=$ONEKVM/target/armv7-unknown-linux-gnueabihf/release/one-kvm
          cp $BIN pkg/usr/bin/

          # 分析依赖
          readelf -d $BIN | grep NEEDED | awk '{print $NF}' | tr -d '[]' > /tmp/needed.txt
          cat /tmp/needed.txt

          # 配置 armhf apt 源
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          sudo rm -f /etc/apt/sources.list.d/ubuntu-*.list /etc/apt/sources.list.d/ports-*.list 2>/dev/null || true
          sudo dpkg --add-architecture armhf
          sudo tee /etc/apt/sources.list.d/armhf.list <<'END'
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          END
          sudo apt-get update -qq

          declare -A SO2PKG=(
            ["ld-linux-armhf.so.3"]="libc6:armhf"
            ["libc.so.6"]="libc6:armhf" ["libm.so.6"]="libc6:armhf"
            ["libpthread.so.0"]="libc6:armhf" ["libdl.so.2"]="libc6:armhf"
            ["librt.so.1"]="libc6:armhf" ["libgcc_s.so.1"]="libgcc-s1:armhf"
            ["libstdc++.so.6"]="libstdc++6:armhf" ["libdrm.so.2"]="libdrm2:armhf"
            ["libudev.so.1"]="libudev1:armhf" ["libasound.so.2"]="libasound2:armhf"
            ["libssl.so.3"]="libssl3:armhf" ["libcrypto.so.3"]="libssl3:armhf"
          )

          PKGS=""
          while read -r so; do
            pkg="${SO2PKG[$so]}"
            [ -n "$pkg" ] && PKGS="$PKGS $pkg" || echo "  ⚠ unmapped: $so"
          done < /tmp/needed.txt
          PKGS=$(echo $PKGS | tr ' ' '\n' | sort -u | tr '\n' ' ')

          sudo apt-get install -y -qq $PKGS ca-certificates binutils-arm-linux-gnueabihf

          L=/lib/arm-linux-gnueabihf UL=/usr/lib/arm-linux-gnueabihf
          while read -r so; do
            [ -f "$L/$so" ] && cp "$L/$so" pkg/usr/lib/one-kvm-libs/ && continue
            [ -f "$UL/$so" ] && cp "$UL/$so" pkg/usr/lib/one-kvm-libs/ && continue
            echo "  ⚠ not found: $so"
          done < /tmp/needed.txt

          arm-linux-gnueabihf-strip pkg/usr/lib/one-kvm-libs/*.so* 2>/dev/null || true
          chmod +x pkg/usr/lib/one-kvm-libs/ld-linux-armhf.so.3
          chmod +x pkg/usr/bin/one-kvm
          cp /etc/ssl/certs/ca-certificates.crt pkg/etc/ssl/certs/

          echo "=== Package ==="
          find pkg -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: onekvm-overlay
          path: pkg/
          retention-days: 1

  build-image:
    needs: build-onekvm
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: onekvm-overlay
          path: /tmp/onekvm-pkg

      - name: 集成到 Buildroot overlay
        run: |
          OVERLAY=sysdrv/tools/board/buildroot/overlay

          # 复制文件到 overlay
          cp -a /tmp/onekvm-pkg/usr $OVERLAY/ 2>/dev/null || true
          cp -a /tmp/onekvm-pkg/etc/ssl $OVERLAY/etc/ 2>/dev/null || true

          # 确保执行权限（Buildroot 保留文件权限）
          chmod +x $OVERLAY/etc/init.d/S85onekvm
          chmod +x $OVERLAY/etc/init.d/S38fixmac
          chmod +x $OVERLAY/usr/bin/one-kvm
          chmod +x $OVERLAY/usr/lib/one-kvm-libs/ld-linux-armhf.so.3

          echo "=== Overlay ==="
          find $OVERLAY -type f -exec ls -la {} \;

      - name: 处理 dl 缓存目录（空目录会导致 buildroot 下载失败）
        run: |
          # dl submodule 拉不到（野火内网GitLab），删除它以让 buildroot 从公网下载
          rm -rf sysdrv/source/buildroot/dl
          mkdir -p sysdrv/source/buildroot/dl

      - name: 安装 SDK 编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libncurses-dev \
            u-boot-tools device-tree-compiler python3 cpio rsync unzip wget file \
            swig python3-dev libpython3-dev gperf cmake meson \
            autoconf automake libtool gettext texinfo help2man

      - name: 初始化工具链
        run: |
          TOOLCHAIN_DIR=tools/linux/toolchain/arm-rockchip830-linux-uclibcgnueabihf
          # 确保工具链二进制可执行
          chmod +x $TOOLCHAIN_DIR/bin/*
          # 检查依赖
          ldd $TOOLCHAIN_DIR/bin/arm-rockchip830-linux-uclibcgnueabihf-gcc || true
          # 安装可能缺失的库
          sudo apt-get install -y -qq libmpfr6 libmpc3 libgmp10 2>/dev/null || true
          # 测试 gcc
          export PATH=$PWD/$TOOLCHAIN_DIR/bin:$PATH
          arm-rockchip830-linux-uclibcgnueabihf-gcc --version

      - name: 编译 LubanCat 完整镜像
        run: |
          ln -sf project/cfg/BoardConfig_IPC/BoardConfig-SD_CARD-NONE-RV1106_LubanCat-RV06.mk .BoardConfig.mk
          chmod +x build.sh
          export RK_BUILD_VERSION_TYPE=RELEASE
          ./build.sh 2>&1 | tee build.log

      - name: 上传编译日志（调试用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3

      - name: 检查产物
        run: |
          echo "=== output/image/ ==="
          ls -lh output/image/ 2>/dev/null || echo "(empty)"
          echo "=== output/out/sysdrv_out/ ==="
          ls -lh output/out/sysdrv_out/ 2>/dev/null || echo "(empty)"
          echo "=== find images ==="
          find output -name "*.img" -o -name "rootfs.*" 2>/dev/null | head -20

      - name: 打包镜像
        run: |
          cd output/image
          zip -j lubancat-rv06-onekvm.zip *.img
          ls -lh lubancat-rv06-onekvm.zip

      - name: 上传 Artifact（临时）
        uses: actions/upload-artifact@v4
        with:
          name: lubancat-rv06-sd-image
          path: output/image/lubancat-rv06-onekvm.zip
          retention-days: 7

      - name: 发布 Release（永久保存）
        uses: softprops/action-gh-release@v2
        with:
          name: "LubanCat-RV06 One-KVM 镜像"
          tag_name: "image-${{ github.run_number }}"
          body: |
            ## LubanCat-RV06 + One-KVM SD 卡镜像

            自动构建于: ${{ github.event.repository.updated_at }}

            ### 文件说明
            | 文件 | 说明 |
            |------|------|
            | update.img | 完整固件，瑞芯微工具一键烧录 |
            | rootfs.img | Buildroot 根文件系统 |
            | boot.img | Linux 内核 + 设备树 |
            | uboot.img | U-Boot 引导程序 |
            | env.img | U-Boot 环境变量 |
            | idblock.img | ID Block |

            ### 使用
            1. 下载 `lubancat-rv06-onekvm.zip`
            2. 解压后用瑞芯微工具烧录 `update.img`
            3. 上电后访问 `http://<板子IP>:8080`

            ### 默认配置
            - 固定 MAC: `42:83:de:86:af:fd`
            - 固定 IP: 在路由器上设置 MAC 绑定
            - SSH: root 无密码
          files: output/image/lubancat-rv06-onekvm.zip
          generate_release_notes: false
